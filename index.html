// ---- overlays and the back button: every open overlay is one history entry, so "back" closes it
const layers = []; let pendingBack = 0;
function pushLayer(name, close, url){ layers.push({name,close}); try{ history.pushState({fa:layers.length}, "", url||location.href); }catch(e){} }
function popLayer(name){                       // closes at once; the history entry is dropped right after
  const i = layers.map(l=>l.name).lastIndexOf(name); if(i<0) return;
  const top = i===layers.length-1 && history.state && history.state.fa===layers.length && pendingBack===0;
  layers.splice(i,1)[0].close();
  if(top){ pendingBack++; history.back(); }
}
window.addEventListener("popstate", e=>{
  const depth = (e.state && e.state.fa) || 0;
  while(layers.length > depth) layers.pop().close();
  if(pendingBack>0){ pendingBack--; if(depth > layers.length){ pendingBack++; history.back(); } return; }
  if(depth > layers.length && location.hash.length>1) openToken(true);     // "forward" to a crag link
});
const baseUrl = () => location.pathname + location.search;

// ---- toast and share links (a bare #<crag> or #<crag>~<route> opens that crag)
let toastTimer = null;
function toast(msg, url, sticky, ms){
  const el = $("toast"); clearTimeout(toastTimer);
  el.innerHTML = `<div class="row"><span style="flex:1">${esc(msg)}</span>${(sticky||url)?`<button class="btn" id="toastx" type="button">${esc(t("close"))}</button>`:""}</div>${url?`<input id="toasturl" readonly aria-label="Link" value="${esc(url)}">`:""}`;
  el.hidden = false;
  const x = $("toastx"); if(x) x.addEventListener("click",()=>{ el.hidden=true; });
  if(url){ const i=$("toasturl"); i.addEventListener("focus",()=>i.select()); if(sticky){ i.focus(); i.select(); } }
  if(!sticky) toastTimer = setTimeout(()=>{ el.hidden=true; }, ms||6000);
}
function share(token, label){
  const url = (/^https?:$/.test(location.protocol) ? location.origin + baseUrl() : location.href.split("#")[0]) + "#" + token;
  const ok = ()=>toast(t("share.copied",label), url, false), no = ()=>toast(t("share.copy",label), url, true);
  if(navigator.share && isPhone()){ navigator.share({title:label, url}).catch(()=>{}); return; }
  try{ navigator.clipboard.writeText(url).then(ok, no); }catch(e){ no(); }
}
function openToken(noPush){
  let tk = (location.hash||"").slice(1); try{ tk = decodeURIComponent(tk); }catch(e){}
  if(!tk) return;
  if(tk==="/fav" || tk==="/more" || tk==="/log"){ try{ history.replaceState({fa:0},"",baseUrl()); }catch(e){} setView(tk.slice(1)); return; }
  const sid = tk.split("~")[0], s = byId[sid];
  if(!s){ toast(t("link.nocrag"), null, false); return; }
  if(s.reg!==prefs.region) setRegion(s.reg);
  if(!shown.includes(s)){ F = F0(); apply(); }
  targetRoute = tk.includes("~") && s.routes.some(r=>r[4]===tk) ? tk : null;
  if(tk.includes("~") && !targetRoute) toast(t("link.noroute"), null, false);
  if(!noPush){ try{ history.replaceState({fa:layers.length},"",baseUrl()); }catch(e){} }
  openDetail(sid, {push:!noPush, keepTarget:true});
  if(s.coord) selectOnMap(sid, {popup:false, fit:true});
}

// ---- filtering. Route criteria are combined inside a crag: a crag stays when it has routes that meet all of them at once.
const gradeActive = ()=>!(F.gmin===GLO&&F.gmax===GHI);
const routeFilterOn = ()=>gradeActive() || F.star!=="any" || F.fav==="routes" || F.log!=="any";
const minNeeded = ()=>(gradeActive() || F.star!=="any") ? F.minIn : 1;       // «at least n routes» goes with grade and stars
function routeOk(r){
  if(gradeActive() && !(r[3]!=null && r[3]>=F.gmin && r[3]<=F.gmax)) return false;
  if(F.star!=="any" && !(r[5]>=+F.star)) return false;
  if(F.fav==="routes" && !fav.r.has(r[4])) return false;
  if(F.log==="todo" && sentSet.has(r[4])) return false;
  if(F.log==="done" && !sentSet.has(r[4])) return false;
  return true;
}
const qFold = ()=>fold(F.q.trim());
function routeShown(s, r){ const q=qFold(); return routeOk(r) && (!(q && s._rhit) || fold(r[0]).includes(q)); }
const routeViewOn = s => s.routes.length>0 && (routeFilterOn() || (qFold() && s._rhit));
function test(s){
  if(F.fav==="crags" && !fav.c.has(s.id)) return false;
  const q = qFold(); s._rhit = false;
  if(q){ const inName = s.hay.includes(q), inRoute = !!(s.rhay && s.rhay.some(r=>r.includes(q))); s._rhit = !inName && inRoute; if(!inName && !inRoute) return false; }
  s._in = null; s._top = null;
  if(routeFilterOn()){
    if(s.routes.length){
      let n = 0; const top = [];
      for(const r of s.routes){ if(routeShown(s,r)){ n++; if(r[5]) top.push(r); } }
      if(n < minNeeded()) return false; s._in = n;
      if(top.length && (gradeActive() || F.star!=="any")) s._top = top.sort((a,b)=>b[5]-a[5] || (b[6]||0)-(a[6]||0)).slice(0,3);   // the best-rated matches, shown on the card
    } else {
      if(F.star!=="any" || F.fav==="routes" || F.log==="done") return false;
      if(gradeActive() && (s.gminI==null || s.gmaxI<F.gmin || s.gminI>F.gmax)) return false;
    }
  }
  if(F.pic==="pic" && !s.pics) return false;
  if(F.pic==="topo" && !s.topoPic) return false;
  if(F.pic==="link" && !(s.topoPic||s.topoLink)) return false;
  if(F.orient.size){
    let ok = !!(s.oriKey && F.orient.has(s.oriKey));
    if(!ok && s.oriKey!=="unknown") ok = s.orient.some(o=>F.orient.has(o));
    if(!ok) return false;
  }
  const w = s.walkEff;
  if(F.walk==="unknown"){ if(w!=null) return false; }
  else if(F.walk==="30+"){ if(w==null||w<=30) return false; }
  else if(F.walk!=="any"){ if(w==null||w>+F.walk) return false; }
  if(F.rain!=="any" && s.rain!==F.rain) return false;
  if(F.wx!=="any" && wx.at){ const w = wxStat(s); if(!w) return false;
    if(w.st!=="dry" && !(F.wx==="ok" && s.rain==="yes")) return false; }
  if(F.dry==="fast" && s.dry!=="fast") return false;
  if(F.dry==="ok" && s.dry!=="fast" && s.dry!=="mid") return false;
  if(F.len!=="any"){ const m=s.lenMax; if(m==null) return false; if(F.len==="40+"){ if(m<=40) return false; } else if(m>+F.len) return false; }
  if(F.count!=="any"){ const n=s.nRoutes; if(n==null || n<+F.count) return false; }          // «at least n routes in the crag»
  const spaced = s.boltSp==="spaced" || s.boltSp==="part";
  if(F.bolt==="close" && s.boltSp!=="close" && s.boltSp!=="good") return false;
  if(F.bolt==="spaced" && !spaced) return false;
  if(F.bolt==="notSpaced" && spaced) return false;
  if(F.boltC==="new" && s.boltC!=="new") return false;
  if(F.boltC==="notOld" && (s.boltC==="old" || s.boltC==="part")) return false;
  if(F.style!=="any" && s.styleKey!==F.style) return false;
  if(F.area && s.area!==F.area) return false;
  if(F.muni){ if(F.muni==="?"){ if(s.municipality) return false; } else if(s.municipality!==F.muni) return false; }
  if(F.conf.size && !F.conf.has(s.confidence)) return false;
  if(F.hideClosure && s.closure) return false;
  if(F.hideCaution && s.caution) return false;
  if(F.hideNoFamily && s.noFamily) return false;
  if(F.onlyMapped && (!s.coord || s.anchor)) return false;
  return true;
}
function sortVal(s){

// an overlay tile layer of geo.admin.ch; after repeated errors it falls back to the WMS service (as in the Wind app)
function chTiles(k){
  const d = CH_OV[k]; let ok = 0, bad = 0, swapped = false;
  const lyr = L.tileLayer(WMTS(d.id,"png"),{pane:"chov", opacity:d.op, maxNativeZoom:18, maxZoom:18, attribution:d.attr, className:"chov"});
  lyr.on("tileload",()=>{ ok++; });
  lyr.on("tileerror",()=>{ if(swapped || ok || ++bad<4 || chOv[k]!==lyr || !map.hasLayer(lyr)) return; swapped = true;
    map.removeLayer(lyr);
    chOv[k] = L.tileLayer.wms("https://wms.geo.admin.ch/?",{layers:d.id, format:"image/png", transparent:true, version:"1.3.0", pane:"chov", opacity:d.op, maxZoom:18, attribution:d.attr}).addTo(map); });
  return lyr;
}
function chOverlays(){
  if(!map) return;
  Object.keys(CH_OV).forEach(k=>{
    const on = regCH() && (prefs[k] || (k==="chTrails" && plan.on));
    if(on && !chOv[k]) chOv[k] = chTiles(k).addTo(map);
    if(!on && chOv[k]){ map.removeLayer(chOv[k]); delete chOv[k]; }
  });
}
// swisstopo services (api3.geo.admin.ch, CORS open): height model, elevation profile and the trail network
const API3 = "https://api3.geo.admin.ch/rest/services/";
function toLV95(lat, lon){                        // WGS84 → LV95 (swisstopo's approximate formulas, ~1 m)
  const phi = (lat*3600 - 169028.66)/10000, lam = (lon*3600 - 26782.5)/10000;
  return [2600072.37 + 211455.93*lam - 10938.51*lam*phi - 0.36*lam*phi*phi - 44.54*lam**3,
          1200147.07 + 308807.95*phi + 3745.25*lam*lam + 76.63*phi*phi - 194.56*lam*lam*phi + 119.79*phi**3];
}
function fromLV95(E, N){                          // LV95 → WGS84 [lat, lon]
  const y = (E - 2600000)/1e6, x = (N - 1200000)/1e6;
  return [(16.9023892 + 3.238272*x - 0.270978*y*y - 0.002528*x*x - 0.0447*y*y*x - 0.0140*x*x*x)*100/36,
          (2.6779094 + 4.728982*y + 0.791484*y*x + 0.1306*y*x*x - 0.0436*y*y*y)*100/36];
}
async function chHeight(lat, lon){
  const [E, N] = toLV95(lat, lon);
  const r = await fetch(`${API3}height?easting=${E.toFixed(1)}&northing=${N.toFixed(1)}&sr=2056`); if(!r.ok) throw new Error("HTTP "+r.status);
  const h = parseFloat((await r.json()).height); if(!(h>0)) throw new Error("no height"); return h;
}
function decodeLine(str){                       // encoded polyline, precision 5 -> [[lat,lon],…]
  const out=[]; let i=0, lat=0, lon=0;
  while(i<str.length){
    for(let k=0;k<2;k++){ let sh=0, res=0, b; do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20);
      const d=(res&1)?~(res>>1):(res>>1); if(k===0) lat+=d; else lon+=d; }
    out.push([lat/1e5, lon/1e5]);
  }
  return out;
}

// start guiding at once. On the iPhone a link to google.com would open a browser page inside the home-screen app, so the app's own

const gmapsApp = p => `comgooglemaps://?saddr=&daddr=${p.lat},${p.lon}&directionsmode=driving`;
const appleUrl = p => `https://maps.apple.com/?daddr=${p.lat},${p.lon}&dirflg=d`;

// Double click or double tap on the map zooms in one step around that point (Shift + double click zooms out).
// Leaflet's own handler only counts two taps less than 200 ms apart, which most double taps on a phone are not; so the taps are counted here.
function dblZoom(){
  const box = map.getContainer(); let down = null, last = null;
  const zoom = (pt, out) => { dblZoom.at = Date.now(); clearTimeout(dblZoom.timer);
    const z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), map.getZoom() + (out?-1:1)));
    if(z!==map.getZoom()) map.setZoomAround(pt, z, {animate:!calm()}); };
  const onBase = el => !el.closest(".leaflet-marker-icon,.leaflet-popup,.leaflet-control,.leaflet-tooltip");
  map.on("dblclick", e=>{ if(Date.now()-dblZoom.at<700) return; zoom(e.containerPoint, e.originalEvent && e.originalEvent.shiftKey); });
  box.addEventListener("touchstart", e=>{ down = e.touches.length===1 && onBase(e.target) ? {x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now()} : null; if(e.touches.length>1) last = null; }, {passive:true});
  box.addEventListener("touchmove", e=>{ if(down && Math.hypot(e.touches[0].clientX-down.x, e.touches[0].clientY-down.y)>12) down = null; }, {passive:true});
  box.addEventListener("touchend", e=>{
    const d = down; down = null; if(e.touches.length) return;
    if(!d || picking || Date.now()-d.t>350){ last = null; return; }          // a drag, a long press or a tap on a marker
    if(last && d.t-last.t<450 && Math.hypot(d.x-last.x, d.y-last.y)<40){ last = null; const r = box.getBoundingClientRect(); zoom(L.point(d.x-r.left, d.y-r.top)); }
    else last = d;
  }, {passive:true});
}
dblZoom.at = 0; dblZoom.timer = null;

function renderMarkers(){
  if(!map) return;
  cluster.clearLayers(); clusterA.clearLayers(); markers={};
  const ms=[], as=[];
  shown.forEach(s=>{ if(!s.coord) return;
    const m = L.marker([s.coord.lat,s.coord.lon],{icon:icon(s),title:s.name,riseOnHover:true});
    m.on("click",()=>{ if(plan.on) return; targetRoute=null; selectOnMap(s.id,{fit:!s.anchor}); });
    markers[s.id]=m; (s.anchor?as:ms).push(m); });
  if(cluster.addLayers){ cluster.addLayers(ms); clusterA.addLayers(as); } else { ms.forEach(m=>cluster.addLayer(m)); as.forEach(m=>clusterA.addLayer(m)); }
  drawAllPaths();
}
function refreshFavMarkers(){ if(!map) return; Object.keys(markers).forEach(id=>markers[id].setIcon(icon(byId[id]))); }
function fitShown(always){
  if(!map) return;
  const pts = (shown.length?shown:S).filter(s=>s.coord).map(s=>[s.coord.lat,s.coord.lon]);
  if(pts.length && (always || !pts.some(p=>map.getBounds().contains(p)) || F.area)) map.fitBounds(pts,{padding:[40,40],maxZoom:16});
}
function drawAllPaths(){
  if(!map) return; allLayer.clearLayers();
  if(!prefs.allPaths) return;
  shown.forEach(s=>{ const ap=s.ap&&s.ap[0]; if(!ap || ap.q==="detour" || s.id===selId) return;
    L.polyline(decodeLine(ap.line),{color:ROUTE_COL,weight:2.5,opacity:.55,interactive:false,attribution:ROUTE_ATTR}).addTo(allLayer); });
}

// ===================================================================== rain: radar on the map, forecast-model rain per crag
// Radar: RainViewer (last ~2 h in 10-minute frames; its free service stops at zoom 7, so the images are enlarged) or
// Radar-DPC of the Italian Civil Protection (latest 5-minute image, 1 km). Per crag: hourly rain from the Open-Meteo model,
// 2 days back and 2 days ahead, for a grid of ~1 km – drives the marks on the markers, the filter «Weather now» and the chart.
// None of these requests go through the service worker, so nothing old is ever shown as current; the age is always printed.
const WX_URL = "https://api.open-meteo.com/v1/forecast", WX_TTL = 30*60*1000, WX_GRID = 0.01, WX_KEY = "finale-atlas:wx";
const WX_ATTR = 'Weather: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0)';
const WX_CH_MODEL = "meteoswiss_icon_seamless";                      // MeteoSwiss ICON-CH1 (1 km, ~33 h) and ICON-CH2 (2 km, 5 days), via Open-Meteo
const WX_CH_ATTR = 'Wetter Schweiz: <a href="https://www.meteoswiss.admin.ch/" target="_blank" rel="noopener">MeteoSchweiz</a> ICON-CH1/CH2 (CC BY 4.0)';

function wxLoad(force){
  if(wx.busy) return wx.busy;
  if(!force && wx.at && Date.now()-wx.at < WX_TTL) return Promise.resolve();
  if(navigator.onLine===false) return Promise.resolve();
  // Swiss crags get the rain of MeteoSwiss' own model (ICON-CH1/CH2, 1–2 km); the probability, which a single model run cannot give,
  // and any hour the Swiss model leaves empty come from Open-Meteo's default blend, like everywhere else.
  const chKeys = new Set(S_ALL.filter(isCHcrag).map(wxKeyOf).filter(Boolean));
  const keys = [...new Set(S_ALL.map(wxKeyOf).filter(Boolean))];
  const groups = [keys.filter(k=>!chKeys.has(k)), keys.filter(k=>chKeys.has(k))];
  const get = async url => { const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); const j = await r.json(); return Array.isArray(j) ? j : [j]; };

    try{
      const pts = Object.create(null);
      for(let g=0; g<2; g++) for(let i=0;i<groups[g].length;i+=100){
        const ch = groups[g].slice(i,i+100);
        const url = `${WX_URL}?latitude=${ch.map(k=>k.split(",")[0]).join(",")}&longitude=${ch.map(k=>k.split(",")[1]).join(",")}`
          + "&hourly=precipitation,precipitation_probability&past_days=2&forecast_days=2&timeformat=unixtime&timezone=GMT";
        const [a, b] = await Promise.allSettled([get(url), g ? get(url.replace("&hourly=precipitation,precipitation_probability","&hourly=precipitation")+"&models="+WX_CH_MODEL) : Promise.reject(null)]);
        if(a.status!=="fulfilled" && b.status!=="fulfilled") throw a.reason;
        const A = a.status==="fulfilled" ? a.value : [], B = b.status==="fulfilled" ? b.value : [];
        ch.forEach((k,n)=>{ const ha = A[n] && A[n].hourly, hb = B[n] && B[n].hourly, h = ha || hb; if(!h) return;
          const t = h.time || [], bt = hb ? hb.time || [] : [], bi = new Map(bt.map((x,i)=>[x,i]));
          const p = t.map((x,i)=>{ const j = bi.get(x), v = hb && j!=null ? hb.precipitation[j] : null; return v!=null ? v : (ha ? ha.precipitation[i] : null); });

      }

      try{ localStorage.setItem(WX_KEY, JSON.stringify({at:wx.at, pts})); }catch(e){}
    }catch(e){ wx.err = String(e && e.message || e); }

}
// st: "rain" (raining now or in the last 3 h), "wet" (≥ 1 mm in the time the wall needs to dry), "soon" (≥ 1 mm or ≥ 60 % in the next 6 h), "dry"
function wxStat(s){
  if(!wx.at) return null;
  const k = wxKeyOf(s), d = k && wx.pts[k]; if(!d || !d.t.length) return null;
  const now = Date.now()/1000, win = (s.dry==="fast"?12:s.dry==="slow"?48:24)*3600;
  let p3=0, p24=0, p48=0, pw=0, n6=0, n24=0, pr6=0, cur=0, last=null;
  for(let i=0;i<d.t.length;i++){
    const mm = +d.p[i]||0, age = now-d.t[i];                 // a value covers the hour that ends at its time stamp
    if(age>=0){ if(age<3*3600) p3+=mm; if(age<86400) p24+=mm; if(age<2*86400) p48+=mm; if(age<win) pw+=mm; if(mm>=0.1 && (last==null||d.t[i]>last)) last=d.t[i]; }
    else if(age>-86400){ n24+=mm; if(age>-6*3600){ n6+=mm; pr6=Math.max(pr6,+d.pr[i]||0); } if(age>-3600) cur=mm; }
  }
  const st = (cur>=0.2 || p3>=0.3) ? "rain" : pw>=1 ? "wet" : (n6>=1 || pr6>=60) ? "soon" : "dry";
  return {st, p24, p48, n6, n24, pr6, since: last==null ? null : (now-last)/3600, d, now};
}

  12: [2, 2, '', 0, 1, 0, 0], 13: [2, 2, 'r', 1, 1, 0, 0], 36: [2, 2, 'r', 1, 1, 0, 0], 37: [2, 2, 's', 1, 1, 0, 0],
  14: [0, 3, 'r', 1, 0, 0, 0], 17: [0, 3, 'r', 2, 0, 0, 0], 20: [0, 3, 'r', 3, 0, 0, 0], 15: [0, 3, 'm', 1, 0, 0, 0], 18: [0, 3, 'm', 2, 0, 0, 0], 21: [0, 3, 'm', 3, 0, 0, 0],
  16: [0, 3, 's', 1, 0, 0, 0], 19: [0, 3, 's', 2, 0, 0, 0], 22: [0, 3, 's', 3, 0, 0, 0],
  23: [0, 3, '', 0, 1, 0, 0], 24: [0, 3, 'r', 2, 1, 0, 0], 25: [0, 3, 'r', 3, 1, 0, 0], 40: [0, 3, 'r', 1, 1, 0, 0], 41: [0, 2, 'r', 1, 1, 0, 0], 38: [0, 2, 'r', 2, 1, 0, 0], 39: [0, 2, 's', 2, 1, 0, 0], 42: [0, 3, 's', 2, 1, 0, 0],

let wxSeq = 0;
function wxInner(code) {

    const free = !cloud;
    const peek = sun === 3;
    const cx = free ? (high ? 27 : 24) : small ? 20 : peek ? 27 : 17, cy = free ? (high ? 26 : 24) : small ? 19 : peek ? 14 : 16, r = free ? 9.5 : small ? 8.5 : peek ? 6.5 : 7.5;
    if (night) {

    } else {
      let rays = '';
      for (let k = 0; k < 8; k++) {
        const a = (k * Math.PI) / 4 + Math.PI / 8 * 0, r1 = r + 2.6, r2 = r + 6.2;
        rays += `M${(cx + r1 * Math.cos(a)).toFixed(1)} ${(cy + r1 * Math.sin(a)).toFixed(1)}L${(cx + r2 * Math.cos(a)).toFixed(1)} ${(cy + r2 * Math.sin(a)).toFixed(1)}`;
      }
      g += `<path d="${rays}" style="stroke:var(--wx-ray)" stroke-width="2.6" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="${r}" style="fill:var(--wx-sun);stroke:var(--wx-ray)" stroke-width="0.8"/>`;
    }

    g += `<g transform="${tr}"><path d="M8 26h21a7 7 0 0 0 0.6-13.97A10 10 0 0 0 10.4 10.5 7.8 7.8 0 0 0 8 26z" style="fill:${fill};stroke:var(--wx-cloud-s)" stroke-width="1.3" stroke-linejoin="round"/></g>`;

  const p = wxPos(s); if(!p) return Promise.resolve(null);

      if(ch && elev==null) elev = await chHeight(p.lat, p.lon).catch(()=>null);
      const q = `${WX_URL}?latitude=${p.lat.toFixed(4)}&longitude=${p.lon.toFixed(4)}${elev!=null?`&elevation=${Math.round(elev)}`:""}`
        + `&hourly=${FC_VARS}&wind_speed_unit=kmh&timeformat=unixtime&timezone=Europe%2FZurich&forecast_days=7`;
      const [a, b] = await Promise.allSettled([ch ? fcJSON(q+"&models="+WX_CH_MODEL) : Promise.reject(null), fcJSON(q)]);
      const A = a.status==="fulfilled" && a.value && a.value.hourly ? a.value : null, B = b.status==="fulfilled" && b.value && b.value.hourly ? b.value : null;

        if(va!=null) return va; const vb = B && B.hourly[k] ? B.hourly[k][i] : null; return vb==null ? null : vb; });
      const chHours = A ? tt.filter(x=>{ const j = ai.get(x); return j!=null && A.hourly.precipitation && A.hourly.precipitation[j]!=null; }).length : 0;
      const o = {at:Date.now(), t:tt, temp:pick("temperature_2m"), rr:pick("precipitation"), wc:pick("weather_code"), day:pick("is_day"),
        ws:pick("wind_speed_10m"), wg:pick("wind_gusts_10m"), wd:pick("wind_direction_10m"), sun:pick("sunshine_duration"),

    d.h.push(i);
    const T = o.temp[i]; if(T!=null){ d.tmin=Math.min(d.tmin,T); d.tmax=Math.max(d.tmax,T); }
    d.rr += +o.rr[i]||0; d.pp = Math.max(d.pp, +o.pp[i]||0); d.sun += +o.sun[i]||0;
    d.ws = Math.max(d.ws, +o.ws[i]||0); d.wg = Math.max(d.wg, +o.wg[i]||0);

function planViaAt(ll){                            // a via point goes into the leg where it adds the least way
  const P = plan.pts; let best = 1, bd = Infinity;
  for(let i=1;i<P.length;i++){ const a = P[i-1], b = P[i]; if(a.lat==null) continue;
    const d = hav(a.lat,a.lon,ll.lat,ll.lng) + hav(ll.lat,ll.lng,b.lat,b.lon) - hav(a.lat,a.lon,b.lat,b.lon); if(d<bd){ bd = d; best = i; } }

let me=null, watchId=null, picking=false, meRendered=null;
function locState(){ const b=$("btnLoc"); if(!b) return; const on=!!me, wait=(watchId!=null&&!me)||picking;
  b.setAttribute("aria-pressed",on?"true":"false"); b.classList.toggle("wait",wait);
  b.title = picking?t("loc.pick"):on?t("loc.centre"):t("loc.show"); b.setAttribute("aria-label",b.title);
  $("map").classList.toggle("pick",picking); }
function setMe(lat,lon,acc,manual){
  const first=!me; me={lat,lon,acc,manual};
  meLayer.clearLayers();
  if(acc && !manual) L.circle([lat,lon],{radius:acc,color:cssv("--me"),weight:1,fillOpacity:.12,interactive:false}).addTo(meLayer);
  L.marker([lat,lon],{zIndexOffset:900,icon:L.divIcon({className:"",iconSize:[18,18],iconAnchor:[9,9],html:`<span class="me${manual?" manual":""}"></span>`})})
    .bindTooltip(manual?t("loc.you.manual"):`${t("loc.you")}${acc?` (±${Math.round(acc)} m)`:""}`).addTo(meLayer);
  if(!meRendered || hav(lat,lon,meRendered[0],meRendered[1])>25){ meRendered=[lat,lon];
    S_ALL.forEach(s=>{ s.meDist = s.coord ? hav(lat,lon,s.coord.lat,s.coord.lon) : null; });
    apply(); if(selId && !$("detail").hidden){ const top=$("detail").scrollTop; renderDetail(byId[selId]); $("detail").scrollTop=top; } }
  if(first){ const pts=S.filter(s=>s.coord), far = pts.length ? Math.min.apply(null,pts.map(s=>s.meDist)) : 0;
    if(far>40000) toast(t("loc.far",fmtDist(far)),null,false);
    else if(!map.getBounds().contains([lat,lon])) map.flyTo([lat,lon],Math.max(map.getZoom(),14),{animate:!calm()}); }

}
function stopMe(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } picking=false; map.off("click",pickClick);
  if(me){ me=null; meRendered=null; meLayer.clearLayers(); S_ALL.forEach(s=>{ s.meDist=null; }); if(sortKey==="me"){ sortKey="area"; $("sort").value="area"; } apply(); }

function startPick(why){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  picking=true; map.once("click",pickClick); locState(); toast(why+" "+t("loc.byhand"),null,false);

function locate(){
  if(!map) return;

  if(me){ if(!map.getBounds().pad(-0.1).contains([me.lat,me.lon])) map.setView([me.lat,me.lon],Math.max(map.getZoom(),15)); else stopMe(); return; }
  if(watchId!=null){ stopMe(); return; }
  if(!navigator.geolocation){ startPick(t("loc.none")); return; }

      err=>{ if(me && err.code!==1) return; startPick(err.code===1 ? t("loc.denied") : t("loc.nofix")); },

}

// ===================================================================== viewport on the iPhone home-screen app
// With the translucent status bar WebKit lays the page out one status bar short (WebKit bug 301108): the page starts at the very top,
// but its height ends above the bottom of the screen, and nothing can be drawn into the strip that remains – only the page background
// shows there. That strip is as tall as the status bar, i.e. taller than the home-indicator inset. So the app uses it as that inset:
// the bars drop their own bottom padding (see html.deadzone in the style sheet) and the page background has the colour of the bars.
// The tab bar then sits on the bottom edge, and no height is lost twice.
function fitViewport(){
  const root = document.documentElement; let dead = 0;
  try{
    if(isIOS && (navigator.standalone===true || matchMedia("(display-mode: standalone)").matches)){
      const portrait = matchMedia("(orientation: portrait)").matches;
      const full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      const d = full - window.innerHeight;
      if(d>=16 && d<=70) dead = d;                 // one status bar; anything else is a window that is simply smaller than the screen
    }
  }catch(e){}
  root.classList.toggle("deadzone", dead>0); root.style.setProperty("--dead", dead+"px");
  return dead;
}
window.addEventListener("orientationchange",()=>setTimeout(()=>{ fitViewport(); if(map) map.invalidateSize(); }, 400));
window.addEventListener("pageshow", fitViewport);

function closeThen(name, fn){

  window.addEventListener("popstate", run); setTimeout(run, 500);
}

function csvText(){
  const cell = v => { v = String(v==null?"":v); return /[;"\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const rows = [[t("lb.date"),t("csv.route"),t("lb.grade"),t("lb.style"),t("csv.stars"),t("csv.crag"),t("f.area"),t("region.label")]];

    rows.push([e.d, e.n, e.g, t("st."+e.st), e.r||"", s?s.name:"", s?s.area:"", rg?regName(rg):""]); });

async function exportCsv(){

  catch(err){ if(err && err.name==="AbortError") return; }
  try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download = name;

function atlasRecords(){
  const out = [], all = []; S_ALL.forEach(s=>s.routes.forEach(r=>all.push([s,r])));
  const link = (s,r,txt) => `<a href="#" data-go="${esc(r?r[4]:s.id)}">${esc(txt)}</a>`;
  const graded = all.filter(x=>x[1][3]!=null);
  const top = L => { let m = -1; L.forEach(x=>{ if(x[1][3]>m) m = x[1][3]; }); return L.filter(x=>x[1][3]===m); };
  const names = L => L.slice(0,3).map(x=>`${link(x[0],x[1],x[1][0])} <span class="num">${esc(x[1][1])}</span> <span class="hint">(${esc(x[0].name)})</span>`).join(", ") + (L.length>3?` <span class="hint">+${L.length-3}</span>`:"");
  if(graded.length){
    out.push([t("rec.hard"), names(top(graded))]);
    D.regions.forEach(rg=>{ const L = top(graded.filter(x=>x[0].reg===rg.key)); if(L.length && L[0][1][3]<top(graded)[0][1][3]) out.push([t("rec.hard.in", rg.name), names(L)]); });
  }
  const big = S_ALL.slice().sort((a,b)=>(b.nRoutes||0)-(a.nRoutes||0))[0];
  if(big) out.push([t("rec.most"), `${link(big,null,big.name)} <span class="hint">(${esc(t("rec.n",big.nRoutes))})</span>`]);
  const asc = all.filter(x=>x[1][6]).sort((a,b)=>b[1][6]-a[1][6]);
  if(asc.length) out.push([t("rec.asc"), `${link(asc[0][0],asc[0][1],asc[0][1][0])} <span class="num">${esc(asc[0][1][1])}</span> <span class="hint">(${esc(asc[0][0].name)} · ${esc(t("rec.asc.v",fmtInt(asc[0][1][6])))})</span>`]);
  const five = asc.filter(x=>x[1][5]===5);
  if(five.length && five[0]!==asc[0]) out.push([t("rec.star"), `${link(five[0][0],five[0][1],five[0][1][0])} <span class="num">${esc(five[0][1][1])}</span> <span class="hint">(${esc(five[0][0].name)} · ${esc(t("rec.asc.v",fmtInt(five[0][1][6])))})</span>`]);
  const rated = S_ALL.filter(s=>s.rate && s.rate.n>=10).sort((a,b)=>b.rate.avg-a.rate.avg)[0];
  if(rated) out.push([t("rec.best"), `${link(rated,null,rated.name)} <span class="hint">(★ ${rated.rate.avg.toFixed(1)})</span>`]);
  const cnt = {}; graded.forEach(x=>{ cnt[x[1][3]] = (cnt[x[1][3]]||0)+1; });
  const mode = Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a])[0];
  if(mode!=null) out.push([t("rec.grade"), `<b class="num">${esc(GR[mode])}</b> <span class="hint">(${esc(t("rec.n",fmtInt(cnt[mode])))})</span>`]);
  const lim = GR.indexOf("6a+"), easy = graded.filter(x=>x[1][3]<=lim).length;
  if(graded.length) out.push([t("rec.easy"), esc(t("rec.pct", Math.round(easy/graded.length*100), fmtInt(easy), fmtInt(graded.length)))]);
  const far = S_ALL.filter(s=>s.walkEff!=null).sort((a,b)=>b.walkEff-a.walkEff)[0];
  if(far) out.push([t("rec.walk"), `${link(far,null,far.name)} <span class="hint">(${esc(t(far.walkHow==="calc"?"min.ca":"min",far.walkEff))})</span>`]);
  const longest = all.slice().sort((a,b)=>b[1][0].length-a[1][0].length)[0];
  if(longest) out.push([t("rec.name"), `${link(longest[0],longest[1],longest[1][0])} <span class="hint">(${esc(longest[0].name)})</span>`]);
  const dup = {}; all.forEach(x=>{ const k = fold(x[1][0]).trim(); if(k.length>2 && !/^(senza nome|sn|s\.n\.|n\.n\.|\?+|progetto|project|variante)\b/.test(k)) (dup[k] = dup[k]||[]).push(x); });
  const dk = Object.keys(dup).sort((a,b)=>dup[b].length-dup[a].length)[0];
  if(dk && dup[dk].length>2) out.push([t("rec.dup"), `«${esc(dup[dk][0][1][0])}» <span class="hint">(${esc(t("rec.times",dup[dk].length))})</span>`]);
  out.push([t("rec.year"), esc(t("rec.year.v", (all.length/365).toFixed(1).replace(".", LANG==="de"?",":".")))]);
  return out;
}

function jumpTo(id){
  const d = $("detail"), el = $(id), h = $("dhead"); if(!el) return;
  if(el.tagName==="DETAILS") el.open = true;
  d.scrollTo({top:Math.max(0, el.offsetTop - h.offsetHeight - 8), behavior:calm()?"auto":"smooth"});
}
function jumpSpy(){                               // mark the section being read in the jump bar
  const d = $("detail"), nav = $("jump"), h = $("dhead"); if(!nav || d.hidden) return;
  const y = d.scrollTop + h.offsetHeight + 30, bs = [...nav.querySelectorAll("[data-jump]")];
  let cur = null; bs.forEach(b=>{ const el = $(b.dataset.jump); if(el && el.offsetTop <= y) cur = b; });
  if(cur && d.scrollTop + d.clientHeight >= d.scrollHeight - 4){ const open = bs.filter(b=>$(b.dataset.jump)); cur = open[open.length-1]; }
  bs.forEach(b=>b.setAttribute("aria-current", b===cur?"true":"false"));
  if(cur && cur!==jumpSpy.cur) nav.scrollTo({left:Math.max(0, cur.offsetLeft - nav.offsetLeft - 40), behavior:calm()?"auto":"smooth"});
  jumpSpy.cur = cur;
}

async function refreshApp(btn){

  try{
    if(window.caches){ const keys = await caches.keys(); await Promise.all(keys.filter(k=>k.indexOf("finale-atlas-shell-")===0).map(k=>caches.delete(k))); }
    if(navigator.serviceWorker){ const r = await navigator.serviceWorker.getRegistration(); if(r) await Promise.race([r.update().catch(()=>{}), new Promise(ok=>setTimeout(ok,4000))]); }
  }catch(e){}

}

// One place for every way of loading: say what is happening, then show the result.
async function packGo(run, what){
  if(packBusy) return;
  packBusy = true; toast(t("pk.loading", what), null, true);
  let res; try{ res = await run(); }catch(e){ res = {ok:false, why:String(e&&e.message||e)}; }
  packBusy = false; $("toast").hidden = true;
  if(res && res.ok){
    const r = D.regions.find(x=>x.key===res.pack.id);
    if(r) prefs.region = r.key;
    packsChanged(true);
    if($("info") && !$("info").hidden) openInfo("packs");
    toast(t(res.replaced?"pk.replaced":"pk.added", regName(r||{name:what}), fmtInt(res.pack.sectors.length)), null, false, 6000);
    if(res.kept===false) toast(t("pk.notkept"), null, false, 9000);
  } else {
    toast(t("pk.bad", (res&&res.why)||""), null, false, 12000);
  }
}

  LANG = l; if(save){ prefs.lang=l; savePrefs(); }

  applyI18n(document); buildControls(); renderSubline(); deselect(); apply();
  if(map && initMap.relabel) initMap.relabel();
  const cur = currentDetail(); if(cur && !$("detail").hidden) renderDetail(cur);
  if(view==="fav") renderFav(); if(view==="more") renderMore(); if(view==="log") renderLog();
}
function prefsChanged(){                          // preferences read from the durable store differ from the quick copy
  applyTheme();
  if(prefs.lang && prefs.lang!==LANG) setLang(prefs.lang,false);
  packSync();                                     // the other tab may have loaded or unloaded a mappack
  if(!D.regions.some(r=>r.key===prefs.region)) prefs.region = D.regions.length ? D.regions[0].key : null;
  if(prefs.region && S.length && S[0].reg!==prefs.region) setRegion(prefs.region,true);
}

// ===================================================================== start
document.documentElement.lang = LANG; applyTheme(); applyI18n(document); fitViewport();
// The crags come from the mappacks in the Cache Storage, which can only be read asynchronously – so the
// app paints its frame first and fills in as soon as the packs are there (a moment, from the device).
(async function begin(){
await packBoot();
S = S_ALL.filter(s=>s.reg===prefs.region); applyRegionAttrs();
buildControls(); loadFilters(); renderSubline();
initMap();
apply();
if(map) fitShown(true);
openToken();
if(prefs.wx || F.wx!=="any") setTimeout(()=>wxLoad(), 800); else wxHintSync();
setTimeout(checkVersion, 3000);
if(packOnlyShowcase() && !prefs.packHint) setTimeout(()=>openInfo("packs"), 400);     // nothing of one's own loaded yet
if(activeFilters() && $("toast").hidden){                  // say that stored filters are in effect, with a way out
  toast(t("f.restored", activeFilters()), null, false, 7000);
  const row = $("toast").querySelector(".row");
  if(row){ const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = t("f.reset");
    b.addEventListener("click",()=>{ const q=F.q; F=F0(); F.q=q; apply(); $("toast").hidden = true; }); row.appendChild(b); }
}
})();
window.addEventListener("hashchange",()=>{ if(!layers.some(l=>l.name==="detail")) openToken(); });
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  const had = !!navigator.serviceWorker.controller; swOn = had;
  const ready = updateReady;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(had) ready(); swOn=true; });
  navigator.serviceWorker.addEventListener("message",e=>{ if(e.data && e.data.type==="UPDATED") ready(); });
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").then(r=>{ swOn=!!(r && (r.active||r.installing||r.waiting)); if(view==="more") renderMore(); }).catch(()=>{}); });
}
window.__atlas = { missing: MISSING, select: selectOnMap, open: openDetail, view: setView, lang: setLang,
  packs: { list: ()=>D.regions.map(r=>({key:r.key, name:r.name, crags:r.n, version:r.version, partial:r.partial, stored:!!packEntry(r.key)})),
    url: u=>packFromUrl(u), file: f=>packFromFile(f), drop: id=>packUninstall(id).then(()=>packsChanged(true)),
    after: ()=>packsChanged(true), region: k=>setRegion(k,true) },
  map: ()=>map, fit: fitViewport, csv: csvText, nav: k=>({web:navUrl(PK[k]), app:gmapsApp(PK[k]), apple:appleUrl(PK[k])}),
  state: ()=>({view, selId, shown: shown.length, ids: shown.map(x=>x.id), layers: layers.map(l=>l.name), lang: LANG, fav:{c:[...fav.c], r:[...fav.r]}, favRes, log: logb.slice(), logRes,
    F: Object.assign({}, F, {orient:[...F.orient], conf:[...F.conf]}), sort: sortKey, dead: document.documentElement.classList.contains("deadzone")}) };

})();
</script>
