name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must already be on (Settings → Pages → Source: GitHub Actions); the workflow token cannot switch it on.
      # On a private repository this needs a paid GitHub plan, otherwise this step fails with "Get Pages site failed".
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          # Named one by one rather than globbed. The repository root used to hold nothing but the
          # app and its data, so `cp ./*.json` was safe; now package.json, tsconfig.json and
          # renovate.json live there too, and none of them belongs on a public site.
          #
          # maps/ is deliberately not published either: a mappack is not part of the app. Whoever
          # wants to offer one puts it where they like and enters its address in the app.
          mkdir _site
          shopt -s nullglob
          # The app: built by `build` and committed, so these are the reviewed bytes.
          cp index.html sw.js _site/
          cp ./workbox-*.js _site/
          cp -R assets _site/assets
          # What the app asks for by name at runtime.
          cp manifest.webmanifest mappack.schema.json _site/
          cp ./*.png ./*.svg ./*.ico _site/
          touch _site/.nojekyll
          # Fail loudly rather than deploying half an app.
          test -s _site/index.html
          test -s _site/sw.js
          test -d _site/assets
      - name: Write version.json
        run: |
          # One version per deploy (date + commit). It is not stamped into the bundle: that would
          # make the build non-reproducible, and the committed output could never be checked
          # against a fresh build. The app reads this file instead -- the service worker caches it
          # with the rest of the shell, and a `no-store` fetch of the same address is how the app
          # notices that a newer version is out.
          V="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          T="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"version":"%s","built":"%s"}\n' "$V" "$T" > _site/version.json
          cat _site/version.json
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
