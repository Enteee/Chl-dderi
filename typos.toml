# The prose and the data in this project are German (Swiss spelling: ss, no ß) with Italian and
# Romansh place names. `typos` only ships an English dictionary, so devenv.nix excludes README.md,
# manifest.webmanifest, index.html and maps/ outright. What is left to configure here are the words
# that still turn up in the files we do check.

[default.extend-words]
# "Oltre" – Oltrefinale, the region west of Finale Ligure.
Oltre = "Oltre"
# "ow" – the pack id of Oberwallis (Upper Valais).
ow = "ow"
# "ba" – appears inside swisstopo layer identifiers.
ba = "ba"

[default]
extend-ignore-re = [
  # Allow an explicit opt-out, the same spellings the typos documentation uses.
  "(?Rm)^.*(#|//|/\\*)\\s*spellchecker:disable-line$",
  "(?s)(#|//|/\\*)\\s*spellchecker:off.*?\\n\\s*(#|//|/\\*)\\s*spellchecker:on",
]
